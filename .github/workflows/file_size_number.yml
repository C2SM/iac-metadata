name: File size number

# Replaces the Jenkins "FileSizeNumber" job (formerly
# jenkins/FileSizeNumber in C2SM/zephyr). Runs src/file_size_number.py for
# every dataset in src/datasets.yaml and writes the resulting meta_*.json
# to /net/co2/c2sm-services/zephyr/file_index, served at
# https://data.iac.ethz.ch/zephyr/file_index/. The frontend reads these
# JSONs to show dataset sizes and file counts.
#
# GitHub-hosted runners can't reach the target host directly (ETH's
# firewall drops non-ETH-network SSH), so the workflow proxies through a
# bastion host, uploads src/ over rsync, and runs
# src/run_file_size_number.sh on the target host - same ssh pattern as
# C2SM/zephyr-request's process_request.yml, reusing the account that
# the Jenkins "atmos"-labeled agent ran as.
#
# Also runs on every push to main that changes datasets.yaml or
# datasets.json, for the added or modified datasets only (see
# .github/scripts/select_datasets.py). Other pipeline changes wait for the
# nightly run, since a daytime run over all datasets can exceed the timeout.
#
# Requires the ssh secrets and variables listed in README "Setup".

on:
  push:
    branches: [main]
    paths:
      - src/datasets.yaml
      - src/datasets.json
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset key from src/datasets.yaml (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

# Push-triggered and nightly runs write the same files, so they wait for
# each other instead of running at the same time.
concurrency:
  group: file_size_number
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      datasets: ${{ steps.select.outputs.datasets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pushes to main are squash merges, so select_datasets.py compares the
      # pushed commit with its parent. Other runs use the dataset input.
      - name: Select datasets
        id: select
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pip install --quiet PyYAML
            python .github/scripts/select_datasets.py --config-only | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$DATASET" ] && ! grep -qxF "$DATASET:" src/datasets.yaml; then
            echo "::error::Unknown dataset '$DATASET', see the top-level keys in src/datasets.yaml"
            exit 1
          else
            printf 'run=true\ndatasets=%s\n' "$DATASET" | tee -a "$GITHUB_OUTPUT"
          fi

  file-size-number:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Datasets run sequentially in one ssh session (see
    # src/run_file_size_number.sh, which also walks every file to size it),
    # unlike the old Jenkins job's parallel branches - generous budget to match.
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        uses: ./.github/actions/setup-ssh
        with:
          bastion-host: ${{ vars.SSH_BASTION_HOST }}
          bastion-user: ${{ vars.SSH_BASTION_USER }}
          bastion-key: ${{ secrets.FOG_SSH_KEY }}
          target-host: ${{ vars.SSH_TARGET_HOST }}
          target-user: ${{ vars.SSH_TARGET_USER }}
          target-key: ${{ secrets.IACDIPL7_SSH_KEY }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Create remote workspace
        id: workdir
        run: |
          remote_dir=$(ssh target 'mkdir -p ~/iac-metadata-runs && mktemp -d ~/iac-metadata-runs/file-size-number-XXXXXXXX')
          echo "path=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Upload scripts to the target host
        run: rsync -avh src/ "target:${{ steps.workdir.outputs.path }}/"

      - name: Run file size number pipeline on the target host
        env:
          DATASET: ${{ needs.select.outputs.datasets }}
        run: |
          ssh target bash -s << REMOTE
          cd '${{ steps.workdir.outputs.path }}'
          bash run_file_size_number.sh $DATASET
          REMOTE

      - name: Remove remote workspace
        if: always()
        run: ssh target "rm -rf '${{ steps.workdir.outputs.path }}'"

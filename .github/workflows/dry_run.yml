name: Dry run

# Runs both pipelines (file_index.yml, file_size_number.yml) for every
# dataset on iacdipl-7 with --dry-run for each pull request that touches
# src/, so a broken script or datasets.yaml entry fails the PR instead of
# the next nightly run. Nothing is copied to the file index. Besides the
# exit code, src/check_outputs.py fails the run if any dataset produced
# an empty result.
#
# A full run takes roughly as long as the nightly runs (up to ~2 h). A new
# push to the PR cancels the run in progress.
#
# Uses the same ssh setup and secrets as file_index.yml. Secrets are not
# available to pull requests from forks, so the job is skipped for those.

on:
  pull_request:
    paths:
      - src/**
      - .github/workflows/dry_run.yml

permissions:
  contents: read

concurrency:
  group: dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry run (${{ matrix.check }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: run_file_index.sh
            check: file_tree
          - script: run_file_size_number.sh
            check: file_size_number
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        env:
          ID_FOG: ${{ secrets.FOG_SSH_KEY }}
          ID_TARGET: ${{ secrets.IACDIPL7_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${ID_FOG}" > ~/.ssh/id_ed25519_fog
          echo "${ID_TARGET}" > ~/.ssh/id_ed25519_iacdipl7

          cat > ~/.ssh/config << 'EOF'
          Host fog
            Hostname fog.ethz.ch
            User ti16102
            IdentityFile ~/.ssh/id_ed25519_fog
            IdentitiesOnly yes
          Host iacdipl7
            Hostname iacdipl-7.ethz.ch
            User l_c2sm
            IdentityFile ~/.ssh/id_ed25519_iacdipl7
            IdentitiesOnly yes
            ProxyJump fog
          EOF

          cat > ~/.ssh/known_hosts << 'EOF'
          fog.ethz.ch ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAIEA1LZFUYJ7qouXhKEf6YpH+QtJlX0cr8Jf390Gkam8ydfy0C35sOZYaHQCxwDo5ghBy6rRlUyJDPRDDy4VZEL25FXsR3U1k6/kKRoGbkhY4lS9i+kNfaveBj1S4Ih8Ykw4q3bauck7dTBrrAu6VGwKtdpU6Lkxh3Wizjilt0wciB8=
          fog.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBI3rw1g+UMRDdjem5htVjJHSPvSmvHKQ9bHiqPzDi9jtkX2dqyKEt8sM2SXhLwcDeawfVODH2okO+Cc28MS7fFo=
          fog.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMGddQwl0gXqcPeL4FFjiyXBrfPXdfDOdX5f+gM+o1F
          iacdipl-7.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZgUr0MuFxJRvEqG/iEZs1QYoG2VvjCPLoRnfW3Ljbv
          iacdipl-7.ethz.ch ssh-rsa 
          iacdipl-7.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBALrIi4NyEffUk2qoJq7tizx6dGqa2YZM007ilq0fOAufd7zpY7RuvVOMNF6Zd93CuOcnfegeRyqMIOG6CV7dYc=
          EOF

          chmod 600 ~/.ssh/config ~/.ssh/known_hosts ~/.ssh/id_ed25519_fog ~/.ssh/id_ed25519_iacdipl7

      - name: Create remote workspace
        id: workdir
        run: |
          remote_dir=$(ssh iacdipl7 'mkdir -p ~/iac-metadata-runs && mktemp -d ~/iac-metadata-runs/dry-run-${{ matrix.check }}-XXXXXXXX')
          echo "path=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Upload scripts to iacdipl-7
        run: rsync -avh src/ "iacdipl7:${{ steps.workdir.outputs.path }}/"

      # -tt allocates a terminal, so a cancelled run also stops the remote
      # processes instead of leaving them scanning the file system.
      - name: Dry run and check outputs on iacdipl-7
        run: |
          ssh -tt iacdipl7 "
            cd '${{ steps.workdir.outputs.path }}' || exit 1
            bash ${{ matrix.script }} --dry-run; status=\$?
            .venv/bin/python check_outputs.py ${{ matrix.check }} || status=1
            exit \$status"

      - name: Remove remote workspace
        if: always() && steps.workdir.outputs.path != ''
        run: ssh iacdipl7 "rm -rf '${{ steps.workdir.outputs.path }}'"

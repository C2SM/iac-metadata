name: Dry run

# Runs both pipelines (file_index.yml, file_size_number.yml) on the target host
# with --dry-run for each pull request that touches src/, so a broken
# script or datasets.yaml entry fails the PR instead of the next nightly
# run. Nothing is copied to the file index. The scripts fail for datasets
# without any data, e.g. due to a wrong path, label or pattern.
#
# If a PR only changes datasets.yaml/datasets.json, only the added or
# modified datasets are run (see .github/scripts/select_datasets.py);
# otherwise all of them, which takes roughly as long as the nightly runs
# (up to ~2 h). PRs that touch neither src/ nor this workflow skip the dry
# run. A new push to the PR cancels the run in progress.
#
# Uses the same ssh setup and secrets as file_index.yml. Secrets are not
# available to pull requests from forks, so the job is skipped for those.
#
# The workflow runs for every PR (no paths filter) and reports one summary
# check, "Dry run", so it can be a required status check: a filtered
# workflow or a skipped matrix job would leave a required check pending.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      datasets: ${{ steps.select.outputs.datasets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select datasets
        id: select
        run: |
          pip install --quiet PyYAML
          python .github/scripts/select_datasets.py | tee -a "$GITHUB_OUTPUT"

  dry-run:
    name: Dry run (${{ matrix.check }})
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: run_file_index.sh
            check: file_tree
          - script: run_file_size_number.sh
            check: file_size_number
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        uses: ./.github/actions/setup-ssh
        with:
          bastion-host: ${{ vars.SSH_BASTION_HOST }}
          bastion-user: ${{ vars.SSH_BASTION_USER }}
          bastion-key: ${{ secrets.FOG_SSH_KEY }}
          target-host: ${{ vars.SSH_TARGET_HOST }}
          target-user: ${{ vars.SSH_TARGET_USER }}
          target-key: ${{ secrets.IACDIPL7_SSH_KEY }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Create remote workspace
        id: workdir
        run: |
          remote_dir=$(ssh target 'mkdir -p ~/iac-metadata-runs && mktemp -d ~/iac-metadata-runs/dry-run-${{ matrix.check }}-XXXXXXXX')
          echo "path=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Upload scripts to the target host
        run: rsync -avh src/ "target:${{ steps.workdir.outputs.path }}/"

      # -tt allocates a terminal, so a cancelled run also stops the remote
      # processes instead of leaving them scanning the file system.
      - name: Dry run on the target host
        env:
          DATASETS: ${{ needs.select.outputs.datasets }}
        run: |
          ssh -tt target "cd '${{ steps.workdir.outputs.path }}' && bash ${{ matrix.script }} --dry-run $DATASETS"

      - name: Remove remote workspace
        if: always() && steps.workdir.outputs.path != ''
        run: ssh target "rm -rf '${{ steps.workdir.outputs.path }}'"

  result:
    name: Dry run
    needs: [select, dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a dry run failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [[ ! "$RESULTS" =~ failure|cancelled ]]

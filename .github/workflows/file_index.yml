name: File index

# Replaces the Jenkins "FileIndex" job (formerly jenkins/FileIndex in
# C2SM/zephyr). Runs src/file_tree.py for every dataset in
# src/datasets.yaml and writes the resulting file_tree_*.json to
# /net/co2/c2sm-services/zephyr/file_index, served at
# https://data.iac.ethz.ch/zephyr/file_index/. The frontend reads these
# JSONs to populate its dataset browser.
#
# GitHub-hosted runners can't reach iacdipl-7.ethz.ch directly (ETH's
# firewall drops non-ETH-network SSH), so the workflow proxies through
# fog.ethz.ch, uploads src/ over rsync, and runs src/run_file_index.sh on
# iacdipl-7 - same ssh pattern as C2SM/zephyr-request's
# process_request.yml, reusing the same iacdipl-7 account (l_c2sm) that
# the Jenkins "atmos"-labeled agent ran as.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FOG_SSH_KEY      - private key for ti16102 on fog.ethz.ch
#   IACDIPL7_SSH_KEY - private key for l_c2sm on iacdipl-7.ethz.ch

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset key from src/datasets.yaml (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  file-index:
    runs-on: ubuntu-latest
    # Datasets run sequentially in one ssh session (see src/run_file_index.sh),
    # unlike the old Jenkins job's parallel branches - generous budget to match.
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dataset input
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          if [ -n "$DATASET" ] && ! grep -qxF "$DATASET:" src/datasets.yaml; then
            echo "::error::Unknown dataset '$DATASET', see the top-level keys in src/datasets.yaml"
            exit 1
          fi

      - name: Configure ssh
        env:
          ID_FOG: ${{ secrets.FOG_SSH_KEY }}
          ID_TARGET: ${{ secrets.IACDIPL7_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${ID_FOG}" > ~/.ssh/id_ed25519_fog
          echo "${ID_TARGET}" > ~/.ssh/id_ed25519_iacdipl7

          cat > ~/.ssh/config << 'EOF'
          Host fog
            Hostname fog.ethz.ch
            User ti16102
            IdentityFile ~/.ssh/id_ed25519_fog
            IdentitiesOnly yes
          Host iacdipl7
            Hostname iacdipl-7.ethz.ch
            User l_c2sm
            IdentityFile ~/.ssh/id_ed25519_iacdipl7
            IdentitiesOnly yes
            ProxyJump fog
          EOF

          cat > ~/.ssh/known_hosts << 'EOF'
          fog.ethz.ch ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAIEA1LZFUYJ7qouXhKEf6YpH+QtJlX0cr8Jf390Gkam8ydfy0C35sOZYaHQCxwDo5ghBy6rRlUyJDPRDDy4VZEL25FXsR3U1k6/kKRoGbkhY4lS9i+kNfaveBj1S4Ih8Ykw4q3bauck7dTBrrAu6VGwKtdpU6Lkxh3Wizjilt0wciB8=
          fog.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBI3rw1g+UMRDdjem5htVjJHSPvSmvHKQ9bHiqPzDi9jtkX2dqyKEt8sM2SXhLwcDeawfVODH2okO+Cc28MS7fFo=
          fog.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMGddQwl0gXqcPeL4FFjiyXBrfPXdfDOdX5f+gM+o1F
          iacdipl-7.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZgUr0MuFxJRvEqG/iEZs1QYoG2VvjCPLoRnfW3Ljbv
          iacdipl-7.ethz.ch ssh-rsa 
          iacdipl-7.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBALrIi4NyEffUk2qoJq7tizx6dGqa2YZM007ilq0fOAufd7zpY7RuvVOMNF6Zd93CuOcnfegeRyqMIOG6CV7dYc=
          EOF

          chmod 600 ~/.ssh/config ~/.ssh/known_hosts ~/.ssh/id_ed25519_fog ~/.ssh/id_ed25519_iacdipl7

      - name: Create remote workspace
        id: workdir
        run: |
          remote_dir=$(ssh iacdipl7 'mkdir -p ~/iac-metadata-runs && mktemp -d ~/iac-metadata-runs/file-index-XXXXXXXX')
          echo "path=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Upload scripts to iacdipl-7
        run: rsync -avh src/ "iacdipl7:${{ steps.workdir.outputs.path }}/"

      - name: Run file index pipeline on iacdipl-7
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          ssh iacdipl7 bash -s << REMOTE
          cd '${{ steps.workdir.outputs.path }}'
          bash run_file_index.sh $DATASET
          REMOTE

      - name: Remove remote workspace
        if: always()
        run: ssh iacdipl7 "rm -rf '${{ steps.workdir.outputs.path }}'"

name: Publish datasets.json

# Publishes src/datasets.json - the curated list of datasets the frontend's
# dataset picker shows (a deliberate subset/wrapper of src/datasets.yaml,
# not derived from it - see README) - to the HTTPS file index on
# iacdipl-7, so it's versioned and reviewed in this repo instead of being
# edited by hand directly on the server.
#
# GitHub-hosted runners can't reach iacdipl-7.ethz.ch directly (ETH's
# firewall drops non-ETH-network SSH), so the workflow proxies through
# fog.ethz.ch - same ssh pattern as file_index.yml / file_size_number.yml.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FOG_SSH_KEY      - private key for ti16102 on fog.ethz.ch
#   IACDIPL7_SSH_KEY - private key for l_c2sm on iacdipl-7.ethz.ch

on:
  push:
    branches: [main]
    paths:
      - src/datasets.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        env:
          ID_FOG: ${{ secrets.FOG_SSH_KEY }}
          ID_TARGET: ${{ secrets.IACDIPL7_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${ID_FOG}" > ~/.ssh/id_ed25519_fog
          echo "${ID_TARGET}" > ~/.ssh/id_ed25519_iacdipl7

          cat > ~/.ssh/config << 'EOF'
          Host fog
            Hostname fog.ethz.ch
            User ti16102
            IdentityFile ~/.ssh/id_ed25519_fog
            IdentitiesOnly yes
          Host iacdipl7
            Hostname iacdipl-7.ethz.ch
            User l_c2sm
            IdentityFile ~/.ssh/id_ed25519_iacdipl7
            IdentitiesOnly yes
            ProxyJump fog
          EOF

          cat > ~/.ssh/known_hosts << 'EOF'
          fog.ethz.ch ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAIEA1LZFUYJ7qouXhKEf6YpH+QtJlX0cr8Jf390Gkam8ydfy0C35sOZYaHQCxwDo5ghBy6rRlUyJDPRDDy4VZEL25FXsR3U1k6/kKRoGbkhY4lS9i+kNfaveBj1S4Ih8Ykw4q3bauck7dTBrrAu6VGwKtdpU6Lkxh3Wizjilt0wciB8=
          fog.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBI3rw1g+UMRDdjem5htVjJHSPvSmvHKQ9bHiqPzDi9jtkX2dqyKEt8sM2SXhLwcDeawfVODH2okO+Cc28MS7fFo=
          fog.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMGddQwl0gXqcPeL4FFjiyXBrfPXdfDOdX5f+gM+o1F
          iacdipl-7.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZgUr0MuFxJRvEqG/iEZs1QYoG2VvjCPLoRnfW3Ljbv
          iacdipl-7.ethz.ch ssh-rsa 
          iacdipl-7.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBALrIi4NyEffUk2qoJq7tizx6dGqa2YZM007ilq0fOAufd7zpY7RuvVOMNF6Zd93CuOcnfegeRyqMIOG6CV7dYc=
          EOF

          chmod 600 ~/.ssh/config ~/.ssh/known_hosts ~/.ssh/id_ed25519_fog ~/.ssh/id_ed25519_iacdipl7

      - name: Publish datasets.json to iacdipl-7
        run: rsync -avh src/datasets.json "iacdipl7:/net/co2/c2sm-services/zephyr/file_index/datasets.json"

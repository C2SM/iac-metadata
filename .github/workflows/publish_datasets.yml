name: Publish datasets.json

# Publishes src/datasets.json - the curated list of datasets the frontend's
# dataset picker shows (a deliberate subset/wrapper of src/datasets.yaml,
# not derived from it - see README) - to the HTTPS file index on
# the target host, so it's versioned and reviewed in this repo instead of
# being edited by hand directly on the server.
#
# GitHub-hosted runners can't reach the target host directly (ETH's
# firewall drops non-ETH-network SSH), so the workflow proxies through a
# bastion host - same ssh pattern as file_index.yml / file_size_number.yml.
#
# Requires the ssh secrets and variables listed in README "Setup".

on:
  push:
    branches: [main]
    paths:
      - src/datasets.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        uses: ./.github/actions/setup-ssh
        with:
          bastion-host: ${{ vars.SSH_BASTION_HOST }}
          bastion-user: ${{ vars.SSH_BASTION_USER }}
          bastion-key: ${{ secrets.FOG_SSH_KEY }}
          target-host: ${{ vars.SSH_TARGET_HOST }}
          target-user: ${{ vars.SSH_TARGET_USER }}
          target-key: ${{ secrets.IACDIPL7_SSH_KEY }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Publish datasets.json to the target host
        run: rsync -avh src/datasets.json "target:/net/co2/c2sm-services/zephyr/file_index/datasets.json"

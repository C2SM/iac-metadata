CORDEX-FPSCONV:
  directory_paths:
    - /net/atmos/data/CORDEX-FPSCONV/ALP-3
  labels:
    - temporal_resolution
    - variable
    - scenario
    - GCM
    - RCM
    - ensemble_member
  pattern:
    file: "*.nc"
    # Leading underscore-separated filename tokens; the date is the last token
    filename_labels:
      - variable
      - domain
      - GCM
      - scenario
      - ensemble_member
      - RCM
  blacklist:
    - lw_output_cosmo
  historical_before: 2015


era5_cds:
  directory_paths:
    - /net/atmos/data/era5_cds/processed/v2
  labels:
    - variable
    - temporal resolution
    - grid
  pattern:
    file: "*/*.nc"
    date: "%Y%m"
    prefix: '{YYYY}/'
    suffix: '{YYYYMM}.nc'
  freq: M
  blacklist:
    - work
    - g025
    - zg500

era5-land_cds:
  directory_paths:
    - /net/atmos/data/era5-land_cds/processed/v1
  labels:
    - variable
    - temporal resolution
    - grid
  pattern:
    file: "*.nc"
    date: "%Y"
    prefix: ''
    suffix: '{YYYY}.nc'
  freq: YE
  blacklist:
    - work

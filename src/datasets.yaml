
cordex:
  directory_paths:
    - /net/atmos/data/cordex/EUR-11/historical
    - /net/atmos/data/cordex/EUR-11/rcp26
    - /net/atmos/data/cordex/EUR-11/rcp45
    - /net/atmos/data/cordex/EUR-11/rcp85
  labels:
    - scenario
    - temporal_resolution
    - variable
    - institution
    - GCM
    - RCM
    - ensemble_member
  pattern:
    file: "*.nc"
  blacklist:
    - work
  historical_before: 2015
  map_root: True

cordex-reklies:
  directory_paths:
    - /net/atmos/data/cordex-reklies/EUR-11/historical
    - /net/atmos/data/cordex-reklies/EUR-11/rcp26
    - /net/atmos/data/cordex-reklies/EUR-11/rcp85
  labels:
    - scenario
    - temporal_resolution
    - variable
    - institution
    - GCM
    - RCM
    - ensemble_member
  pattern:
    file: "*.nc"
  blacklist:
    - work
  historical_before: 2015
  map_root: True


CORDEX-FPSCONV:
  directory_paths:
    - /net/atmos/data/CORDEX-FPSCONV/ALP-3
  labels:
    - temporal_resolution
    - variable
    - scenario
    - variable
    - domain
    - GCM
    - scenario
    - ensemble_member
    - RCM
    - nesting
    - temporal_resolution
  pattern:
    file: "*.nc"
  blacklist:
    - processed_CPMs
    - processed_RCMs


era5_cds:
  directory_paths:
    - /net/atmos/data/era5_cds/processed/v2
  labels:
    - variable
    - temporal resolution
    - grid
  pattern:
    file: "*/*.nc"
    date: "%Y%m"
    prefix: '{YYYY}/'
    suffix: '{YYYYMM}.nc'
  freq: M
  blacklist:
    - work
    - g025
    - zg500

era5-land_cds:
  directory_paths:
    - /net/atmos/data/era5-land_cds/processed/v1
  labels:
    - variable
    - temporal resolution
    - grid
  pattern:
    file: "*.nc"
    date: "%Y"
    prefix: ''
    suffix: '{YYYY}.nc'
  freq: YE
  blacklist:
    - work

cerra:
  directory_paths:
    - /net/atmos/data/cerra/processed/v1/
  labels:
    - variable
    - temporal resolution
    - grid
  pattern:
    file: "*.nc"
    date: "%Y"
    prefix: ''
    suffix: '{YYYY}.nc'
  freq: YE
  blacklist:
    - work

cerra-land:
  directory_paths:
    - /net/atmos/data/cerra-land/processed/v1
  labels:

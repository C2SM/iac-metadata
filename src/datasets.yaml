    - temporal resolution
    - grid
  pattern:
    file: "*.nc"
    date: "%Y"
    prefix: ''
    suffix: '{YYYY}.nc'
  freq: YE
  blacklist:
    - work

cmip5:
  directory_paths:
     - /net/atmos/data/cmip5/historical
     - /net/atmos/data/cmip5/rcp26
     - /net/atmos/data/cmip5/rcp45
     - /net/atmos/data/cmip5/rcp60
     - /net/atmos/data/cmip5/rcp85
  labels:
    - scenario
    - temporal_resolution
    - variable
    - GCM
    - ensemble_member
  pattern:
    file: "*.nc"
  blacklist:
    - work
  historical_before: 2006
  map_root: True

